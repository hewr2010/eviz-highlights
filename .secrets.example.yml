# 敏感配置模板 —— 复制为 .secrets.yml 并填入真实值（.secrets.yml 不进 git）。
#   cp .secrets.example.yml .secrets.yml

# 萤石开放平台 https://open.ys7.com （控制台 → 应用管理）
ezviz_app_key: "YOUR_APP_KEY"
ezviz_app_secret: "YOUR_APP_SECRET"

# Bark 推送 key（iOS Bark App → 复制 key）
bark_key: "YOUR_BARK_KEY"

# 百度网盘 bypy 上传目录（相对于 /apps/bypy，不存在会自动创建）
netdisk_dir: "ezviz-highlights"

# 摄像头列表
#   serial: 设备序列号（机身标签 / App → 设备设置 → 关于本机）
#   ip:     摄像头局域网 IP（与运行本工程的电脑同一网段）
#   code:   设备验证码（机身标签 / App → 设备设置 → 关于本机 → 设备验证码）
cameras:
  - serial: "YOUR_SERIAL_1"
    name: "卧室"
    ip: "192.168.1.101"
    code: "VERIFY_CODE_1"
  - serial: "YOUR_SERIAL_2"
    name: "客厅"
    ip: "192.168.1.102"
    code: "VERIFY_CODE_2"
